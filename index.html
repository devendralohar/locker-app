<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3347C7">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Family Locker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: sticky header, status summary, family member chips, an "needs attention" list first, then every document sorted by expiry. Detail and forms open as bottom sheets; files open in a full-screen viewer. */
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --ink:#151936; --muted:#5E6485; --line:#DADDEB;
  --accent:#3347C7; --accent-ink:#FFFFFF; --soft:#E3E7FB;
  --ok:#1F7A45; --okbg:#DDF1E4; --warn:#8F5600; --warnbg:#FBEBCB; --bad:#B3321F; --badbg:#FADCD6; --shade:rgba(10,12,40,.5);
  --display:'Space Grotesk','Segoe UI',system-ui,sans-serif; --body:'Inter','Segoe UI',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#171B30; --ink:#E8EAF8; --muted:#9AA0C4; --line:#2A3052;
  --accent:#8E9CFF; --accent-ink:#0C1236; --soft:#20274A;
  --ok:#62D08C; --okbg:#17382A; --warn:#F2B65A; --warnbg:#3B2E14; --bad:#FF8B7A; --badbg:#3F1D1D; --shade:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#171B30; --ink:#E8EAF8; --muted:#9AA0C4; --line:#2A3052;
  --accent:#8E9CFF; --accent-ink:#0C1236; --soft:#20274A;
  --ok:#62D08C; --okbg:#17382A; --warn:#F2B65A; --warnbg:#3B2E14; --bad:#FF8B7A; --badbg:#3F1D1D; --shade:rgba(0,0,0,.65); color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

.head{position:sticky;top:0;z-index:9;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:21px}
.tools{display:flex;gap:8px}
.ib{width:38px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.2}
.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}.stat.ok b{color:var(--ok)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sec{margin-top:22px}
.sec>h2{font-size:16px;margin-bottom:10px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row .n{min-width:0;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;flex:none}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.none{background:var(--soft);color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 14px;font-size:13px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 18px;font-weight:700;min-height:46px;position:relative;text-align:center}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:14px 22px;border-radius:999px;font-size:16px}

.back{position:fixed;inset:0;z-index:40;background:var(--shade)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.fld input,.fld select,.fld textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.acts{display:flex;gap:10px;flex-wrap:wrap}.acts .btn{flex:1}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--muted);font-size:13px}
.kv .v{text-align:right;overflow-wrap:anywhere;min-width:0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.th{width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--accent)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:6px}
.frow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.frow button{color:var(--bad);font-weight:700;font-size:12px}
.note{font-size:12.5px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;min-height:18px}

.lockv{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;max-width:320px;margin:0 auto}
.lockic{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.lockic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lockv input{width:100%;text-align:center;font:500 22px var(--mono);letter-spacing:.12em;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.lockv .btn{width:100%}

#viewer{position:fixed;inset:0;z-index:60;background:#0B0D1A;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 12px}
.vb{background:#ffffff1f;border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px;color:#fff}
.vt{flex:1;min-width:0;text-align:center;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt small{display:block;font-size:11px;opacity:.65;font-weight:400}
.vbody{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:6px}
.vbody img{max-width:100%;max-height:100%;margin:auto;object-fit:contain}
.vbody img.zoom{max-width:none;max-height:none;width:240%}
.vbody canvas{width:100%;max-width:900px;background:#fff;margin-bottom:8px;display:block}
.vnav{display:flex;gap:10px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.vnav button{flex:1;background:#ffffff1f;border-radius:8px;padding:10px;color:#fff;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="layer"></div>
<div id="viewer" hidden></div>
<script>
(function(){
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const p2=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>isoD(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return isoD(d)};
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const fdate=s=>s?new Date(s+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';
const TYPES=['Aadhaar card','PAN card','Passport','Driving licence','Voter ID','Insurance policy','Vaccination certificate','Birth certificate','Marriage certificate','Vehicle RC','Property paper','Bank document','Other'];
const WARN=[30,60,90,180];
const cfg={members:[{id:'m1',name:'Me'}],warn:90,theme:'',pin:'',salt:'',seeded:false};
let docs=[],db=null;
const S={member:'all',locked:false,showNum:false,kdf:null};
const isPdf=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name||'');
let U=new WeakMap();const URLS=new Set();
const url=b=>{if(!U.has(b)){const u=URL.createObjectURL(b);U.set(b,u);URLS.add(u)}return U.get(b)};
function revokeUrls(){URLS.forEach(u=>URL.revokeObjectURL(u));URLS.clear();U=new WeakMap()}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}

/* ---------- storage ---------- */
function openDB(){return new Promise(res=>{try{const q=indexedDB.open('family-locker',2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('docs'))d.createObjectStore('docs',{keyPath:'id'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'k'})};q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);q.onblocked=()=>res(null)}catch(e){res(null)}})}
const st=m=>db.transaction('docs',m).objectStore('docs');
function dbAll(){return new Promise(r=>{if(!db)return r([]);try{const q=st('readonly').getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])}catch(e){r([])}})}
async function putDoc(d){
  const i=docs.findIndex(x=>x.id===d.id);if(i<0)docs.push(d);else docs[i]=d;
  if(!db)return false;
  try{
    const rec=S.kdf?await seal(d):d;
    await new Promise((res,rej)=>{const q=st('readwrite').put(rec);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});
    return true;
  }catch(e){toast('Could not save. Phone storage may be full.');return false}
}
function delDoc(id){docs=docs.filter(x=>x.id!==id);if(db)try{st('readwrite').delete(id)}catch(e){}}
function saveCfg(){try{localStorage.setItem('fl_cfg',JSON.stringify(cfg))}catch(e){}}
function loadCfg(){try{Object.assign(cfg,JSON.parse(localStorage.getItem('fl_cfg')||'{}'))}catch(e){}if(!cfg.members||!cfg.members.length)cfg.members=[{id:'m1',name:'Me'}]}
function applyTheme(){if(cfg.theme)document.documentElement.dataset.theme=cfg.theme;else document.documentElement.removeAttribute('data-theme')}
const isDark=()=>{const d=document.documentElement.dataset.theme;return d?d==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
const memberName=id=>(cfg.members.find(m=>m.id===id)||cfg.members[0]).name;

/* ---------- PIN ---------- */
async function hashPin(pin,salt){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
/* ---------- encryption (AES-256-GCM, key from passcode with PBKDF2) ---------- */
const enc=new TextEncoder(),dec=new TextDecoder(),CHECK='family-locker-ok';
let KEY=null;
const u8b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const b64u8=s=>{const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
const hasLock=()=>!!(S.kdf||cfg.pin);
async function deriveKey(pass,salt,iter){
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encBuf(buf){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,buf);return {iv,ct}}
const decBuf=(iv,ct,key)=>crypto.subtle.decrypt({name:'AES-GCM',iv},key||KEY,ct);
async function verify(key,kdf){const pt=await decBuf(b64u8(kdf.iv),b64u8(kdf.check),key);if(dec.decode(pt)!==CHECK)throw new Error('bad passcode')}
async function checkPass(pass){try{const k=await deriveKey(pass,b64u8(S.kdf.salt),S.kdf.iter);await verify(k,S.kdf);return k}catch(e){return null}}
async function seal(d){
  const meta={type:d.type,name:d.name,member:d.member,number:d.number,issued:d.issued,expiry:d.expiry,notes:d.notes,sample:!!d.sample,files:(d.files||[]).map(f=>({name:f.name,type:f.type}))};
  const m=await encBuf(enc.encode(JSON.stringify(meta))),files=[];
  for(const f of d.files||[]){const e=await encBuf(await f.blob.arrayBuffer());files.push({iv:e.iv,ct:e.ct})}
  return {id:d.id,v:2,iv:m.iv,meta:m.ct,files};
}
async function unsealRec(r,key){
  const meta=JSON.parse(dec.decode(await decBuf(r.iv,r.meta,key))),files=[];
  for(let i=0;i<r.files.length;i++){const m=meta.files[i];files.push({name:m.name,type:m.type,blob:new Blob([await decBuf(r.files[i].iv,r.files[i].ct,key)],{type:m.type})})}
  const rest=Object.assign({},meta);delete rest.files;
  return Object.assign({id:r.id},rest,{files});
}
function commit(recs,kdf){return new Promise((res,rej)=>{
  const tx=db.transaction(['docs','meta'],'readwrite'),ds=tx.objectStore('docs'),ms=tx.objectStore('meta');
  recs.forEach(r=>ds.put(r));if(kdf)ms.put({k:'kdf',v:kdf});else ms.delete('kdf');
  tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>rej(tx.error||new Error('save failed'));
})}
function getMeta(){return new Promise(r=>{try{const q=db.transaction('meta').objectStore('meta').get('kdf');q.onsuccess=()=>r(q.result?q.result.v:null);q.onerror=()=>r(null)}catch(e){r(null)}})}
async function loadAll(){
  const raw=await dbAll(),out=[];let bad=0;
  for(const r of raw){try{out.push(r.iv&&r.meta?await unsealRec(r,KEY):r)}catch(e){bad++}}
  docs=out;if(bad)toast(bad+' item'+(bad>1?'s':'')+' could not be opened.');
}
async function enableEnc(pass){
  if(!db)throw new Error('no storage');
  const salt=crypto.getRandomValues(new Uint8Array(16)),iter=600000,key=await deriveKey(pass,salt,iter);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const check=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(CHECK)));
  const kdf={salt:u8b64(salt),iter,iv:u8b64(iv),check:u8b64(check)};
  const old=KEY;KEY=key;
  try{const recs=[];for(const d of docs)recs.push(await seal(d));await commit(recs,kdf)}catch(e){KEY=old;throw e}
  S.kdf=kdf;cfg.pin='';cfg.salt='';saveCfg();
}
async function disableEnc(){await commit(docs.slice(),null);KEY=null;S.kdf=null}
function saveText(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function backup(){
  if(!S.kdf)return backupPlain();
  toast('Preparing encrypted backup...');
  const recs=[];
  for(const d of docs){const r=await seal(d);recs.push({id:r.id,iv:u8b64(r.iv),meta:u8b64(new Uint8Array(r.meta)),files:r.files.map(f=>({iv:u8b64(f.iv),ct:u8b64(new Uint8Array(f.ct))}))})}
  saveText('family-locker-backup-'+today()+'.json',JSON.stringify({app:'family-locker',v:2,enc:true,kdf:S.kdf,members:cfg.members,docs:recs}));
}
let pendingRestore=null;
async function restore(file){
  let j;try{j=JSON.parse(await file.text())}catch(e){j=null}
  if(!j||j.app!=='family-locker'||!Array.isArray(j.docs)){toast('That is not a Family Locker backup.');return}
  if(j.enc){
    pendingRestore=j;
    sheet(`<div class="in"><h2>Encrypted backup</h2><p class="muted" style="margin:0">Enter the passcode this backup was made with.</p><label class="fld"><span>Backup passcode</span><input id="bkPass" type="password" autocomplete="off"></label><div id="pinErr" class="err"></div><div class="acts"><button class="btn" data-act="restoreenc">Restore</button><button class="btn ghost" data-act="close">Cancel</button></div></div>`,'Encrypted backup');
    return;
  }
  return restorePlain(file);
}
function lockNow(){if(!hasLock())return;state_close();revokeUrls();KEY=null;if(S.kdf)docs=[];S.locked=true;render()}
function state_close(){closeViewer();$('#layer').innerHTML='';document.body.classList.remove('lock');S.showNum=false}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hasLock()&&hiddenAt&&Date.now()-hiddenAt>30000)lockNow()});

/* ---------- status ---------- */
const dur=n=>n<60?n+(n===1?' day':' days'):Math.round(n/30)+' months';
function status(d){
  if(!d.expiry)return{k:'none',t:'No expiry',n:99999};
  const n=dayDiff(today(),d.expiry);
  if(n<0)return{k:'bad',t:'Expired '+dur(-n)+' ago',n};
  if(n===0)return{k:'warn',t:'Expires today',n};
  if(n<=cfg.warn)return{k:'warn',t:'Expires in '+dur(n),n};
  return{k:'ok',t:'Valid till '+fdate(d.expiry),n};
}
const mask=n=>n?('•••• '+String(n).replace(/\s/g,'').slice(-4)):'';

/* ---------- reading documents ---------- */
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function mkDate(y,m,d){y=+y;if(y<100)y+=2000;m=+m;d=+d;if(m<1||m>12||d<1||d>31)return null;return y+'-'+p2(m)+'-'+p2(d)}
function findDates(t){
  const r=[];let m;
  const A=/\b(\d{1,2})[\s\-\/.,]{0,3}(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*[\s\-\/.,]{0,3}(\d{4}|\d{2})\b/gi;
  while((m=A.exec(t)))r.push([m.index,mkDate(m[3],MON[m[2].toLowerCase()],m[1])]);
  const B=/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})\b/gi;
  while((m=B.exec(t)))r.push([m.index,mkDate(m[3],MON[m[1].toLowerCase()],m[2])]);
  const C=/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})\b/g;
  while((m=C.exec(t)))r.push([m.index,mkDate(m[3],m[2],m[1])]);
  return r.filter(x=>x[1]).sort((a,b)=>a[0]-b[0]);
}
function dateAfter(t,re,span){const i=t.search(re);if(i<0)return null;const d=findDates(t.slice(i,i+(span||60)))[0];return d?d[1]:null}
function parseDoc(raw){
  const t=raw.replace(/[ \t]+/g,' '),o={};
  let m;
  if(/aadhaar|uidai|आधार|unique identification/i.test(t)&&(m=t.match(/\b([2-9]\d{3})\s?(\d{4})\s?(\d{4})\b/))){o.type='Aadhaar card';o.number=m[1]+' '+m[2]+' '+m[3]}
  else if((m=t.match(/\b[A-Z]{5}\d{4}[A-Z]\b/))&&/income tax|permanent account|PAN/i.test(t)){o.type='PAN card';o.number=m[0]}
  else if(/passport|republic of india/i.test(t)&&(m=t.match(/\b[A-PR-WY][1-9]\d{6}\b/))){o.type='Passport';o.number=m[0]}
  else if(/driving licen|DL No|transport/i.test(t)&&(m=t.match(/\b[A-Z]{2}\s?-?\d{2}\s?-?\d{4}\s?\d{7}\b/))){o.type='Driving licence';o.number=m[0]}
  else if(/election commission|voter|EPIC/i.test(t)&&(m=t.match(/\b[A-Z]{3}\d{7}\b/))){o.type='Voter ID';o.number=m[0]}
  else if(/policy/i.test(t)&&(m=t.match(/Policy\s*(?:No\.?|Number)\s*[:\-]?\s*([A-Z0-9\/\-]{6,25})/i))){o.type='Insurance policy';o.number=m[1]}
  let exp=dateAfter(t,/Valid\s*(?:till|upto|up to|until|to)|Date of Expiry|Expiry(?:\s*Date)?|Expires?(?:\s*on)?|Policy\s*(?:End|Expiry)|To Date/i,70);
  if(!exp){
    const pi=t.search(/Period of Insurance|Policy Period|Insurance Period/i);
    if(pi>=0){const ds=findDates(t.slice(pi,pi+120));if(ds.length>1)exp=ds[1][1]}
  }
  if(exp)o.expiry=exp;
  const iss=dateAfter(t,/Date of Issue|Issued(?:\s*on)?|Issue Date|Date of First Issue/i,50);
  if(iss)o.issued=iss;
  return o;
}
function loadScript(u,test){return new Promise((res,rej)=>{if(test())return res();const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error('Could not load the text reader. Check your internet connection.'));document.head.append(s)})}
async function toCanvas(blob){
  const bmp=await createImageBitmap(blob),s=Math.min(1,2400/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  const x=c.getContext('2d');x.drawImage(bmp,0,0,c.width,c.height);
  const im=x.getImageData(0,0,c.width,c.height),d=im.data;let sum=0,n=0;
  for(let i=0;i<d.length;i+=40){sum+=d[i]*.3+d[i+1]*.59+d[i+2]*.11;n++}
  const inv=sum/n<110;
  for(let i=0;i<d.length;i+=4){let g=d[i]*.3+d[i+1]*.59+d[i+2]*.11;if(inv)g=255-g;d[i]=d[i+1]=d[i+2]=g}
  x.putImageData(im,0,0);return c;
}
async function ocr(src,say){
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',()=>!!window.Tesseract);
  say('Loading the text reader (first time only)...');
  const w=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')say('Reading text '+Math.round(m.progress*100)+'%')}});
  try{return (await w.recognize(src)).data.text}finally{await w.terminate()}
}
async function extractText(f,say){
  if(isPdf(f)){
    if(!window.pdfjsLib)throw new Error('The PDF reader did not load.');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await f.blob.arrayBuffer()}).promise;
    let text='';
    for(let n=1;n<=Math.min(pdf.numPages,6);n++){
      say('Reading PDF page '+n+'...');
      const pg=await pdf.getPage(n),tc=await pg.getTextContent(),rows={};
      tc.items.forEach(it=>{const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push(it)});
      Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{text+=rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ')+'\n'});
    }
    if(text.replace(/\s/g,'').length>=40)return text;
    text='';
    for(let n=1;n<=Math.min(pdf.numPages,3);n++){
      const pg=await pdf.getPage(n),vp=pg.getViewport({scale:2}),c=document.createElement('canvas');
      c.width=vp.width;c.height=vp.height;
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      text+='\n'+await ocr(c,say);
    }
    return text;
  }
  return ocr(await toCanvas(f.blob),say);
}
async function scan(){
  const msg=$('#scanMsg');if(!msg||!F)return;
  if(!F.files.length){msg.textContent='Add a photo or PDF first, then tap Read details.';return}
  const btn=$('[data-act="scan"]');if(btn)btn.disabled=true;
  const say=s=>{const m=$('#scanMsg');if(m)m.textContent=s};
  say('Reading...');
  let text='',err='';
  for(const f of F.files){try{text+='\n'+await extractText(f,say)}catch(e){err=(e&&e.message)||'Could not read the file.'}}
  if(btn)btn.disabled=false;
  const m=$('#scanMsg');if(!m||!F)return;
  if(text.replace(/\s/g,'').length<10){m.textContent=err||'No readable text found. Try a clearer photo.';return}
  const o=parseDoc(text),done=[];
  if(o.type&&$('#f_type')){$('#f_type').value=o.type;done.push('Type');if(!$('#f_name').value.trim()){$('#f_name').value=o.type;done.push('Name')}}
  if(o.number&&$('#f_number')){$('#f_number').value=o.number;done.push('Number')}
  if(o.expiry&&$('#f_expiry')){$('#f_expiry').value=o.expiry;done.push('Expiry date')}

  m.textContent=done.length?'Filled: '+done.join(', ')+'. Please check each field before saving.':'Could not find any details. Fill them in by hand.';

  det.append(pre);m.append(det);
}

async function renderPdf(blob,box){
  if(!window.pdfjsLib){box.innerHTML='<p>The PDF viewer could not load. Check your internet connection.</p>';return}
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;
    const w=Math.max(320,box.clientWidth)*Math.min(2,window.devicePixelRatio||1);
    for(let n=1;n<=pdf.numPages;n++){
      const p=await pdf.getPage(n),v1=p.getViewport({scale:1}),vp=p.getViewport({scale:w/v1.width});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;box.append(c);

function b64(blob){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>res('');fr.readAsDataURL(blob)})}

  const rowH=d=>{const s=status(d);return `<button class="row" data-act="open" data-id="${d.id}"><span class="n"><b>${esc(d.name)}</b><div class="s">${esc(d.type)}${S.member==='all'&&cfg.members.length>1?' · '+esc(memberName(d.member)):''}${d.number?' · '+esc(mask(d.number)):''}${d.files&&d.files.length?' · '+d.files.length+' file'+(d.files.length>1?'s':''):''}</div></span><span class="pill ${s.k}">${esc(s.t)}</span></button>`};
  const icon=isDark()?'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>':'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>';
  $('#app').innerHTML=`<header class="head"><span class="brand">Family Locker</span><div class="tools">${hasLock()?`<button class="ib" data-act="locknow" aria-label="Lock now">${lockSvg}</button>`:''}<button class="ib" data-act="theme" aria-label="Switch theme"><svg viewBox="0 0 24 24">${icon}</svg></button><button class="ib" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg></button></div></header>
  ${docs.some(d=>d.sample)?'<div class="banner"><span>These are sample documents.</span><button class="chip" data-act="rmsample">Remove</button></div>':''}
  <div class="stats"><div class="stat bad"><span class="label">Expired</span><b>${cnt('bad')}</b></div><div class="stat warn"><span class="label">Expiring</span><b>${cnt('warn')}</b></div><div class="stat ok"><span class="label">Valid</span><b>${cnt('ok')+cnt('none')}</b></div></div>
  ${cfg.members.length>1?`<div class="chips"><button class="chip ${S.member==='all'?'on':''}" data-act="member" data-id="all">Everyone</button>${cfg.members.map(m=>`<button class="chip ${S.member===m.id?'on':''}" data-act="member" data-id="${m.id}">${esc(m.name)}</button>`).join('')}</div>`:''}
  ${attn.length?`<section class="sec"><h2>Needs attention</h2><div class="list">${attn.map(rowH).join('')}</div></section>`:''}
  <section class="sec"><h2>${attn.length?'All other documents':'Documents'}</h2>${rest.length?`<div class="list">${rest.map(rowH).join('')}</div>`:(attn.length?'<p class="note">Nothing else.</p>':'<div class="empty">No documents yet.<br>Tap Add, take a photo of an ID or policy, and set its expiry date.</div>')}</section>
  <button class="btn fab" data-act="add">+ Add</button>`;
}
async function unlock(){
  const v=($('#pinIn')||{}).value||'',e=$('#pinErr'),btn=$('[data-act="unlock"]');
  if(!v)return;
  if(!S.kdf){
    // older PIN-only lock: unlock, then upgrade to real encryption with the same PIN
    if(await hashPin(v,cfg.salt)===cfg.pin){S.locked=false;render();enableEnc(v).then(()=>toast('Your files are now encrypted'),()=>{})}
    else{if(e)e.textContent='Wrong passcode. Try again.';const i=$('#pinIn');if(i){i.value='';i.focus()}}
    return;
  }
  if(e)e.textContent='Unlocking...';if(btn)btn.disabled=true;
  const k=await checkPass(v);
  if(!k){if(e)e.textContent='Wrong passcode. Try again.';if(btn)btn.disabled=false;const i=$('#pinIn');if(i){i.value='';i.focus()}return}
  KEY=k;
  try{await loadAll()}catch(err){toast('Could not open your documents.')}
  S.locked=false;render();
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;e.preventDefault();
  switch(a){
    case 'unlock':unlock();break;
    case 'forgot':
      if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Tap again to erase everything and reset';break}
      await wipeAll();break;
    case 'locknow':lockNow();break;
    case 'theme':cfg.theme=isDark()?'light':'dark';saveCfg();render();break;
    case 'member':S.member=id;render();break;
    case 'settings':openSettings();break;
    case 'add':openForm();break;
    case 'open':openDetail(id);break;
    case 'edit':openForm(id);break;
    case 'close':closeSheet();break;
    case 'shownum':S.showNum=!S.showNum;openDetail(id);break;
    case 'copynum':{const d=docs.find(x=>x.id===id);try{navigator.clipboard.writeText(d.number).then(()=>toast('Copied'),()=>toast('Could not copy.'))}catch(err){toast('Could not copy.')}break}
    case 'shareall':{const d=docs.find(x=>x.id===id);shareFiles(d,d.files);break}
    case 'view':{const d=docs.find(x=>x.id===id);VW={doc:d,i:+b.dataset.i};drawViewer();break}
    case 'vclose':closeViewer();break;
    case 'vprev':VW.i=(VW.i-1+VW.doc.files.length)%VW.doc.files.length;drawViewer();break;
    case 'vnext':VW.i=(VW.i+1)%VW.doc.files.length;drawViewer();break;
    case 'vshare':shareFiles(VW.doc,[VW.doc.files[VW.i]]);break;
    case 'rmfile':F.files.splice(+b.dataset.i,1);fileList();break;
    case 'scan':scan();break;
    case 'saveform':saveForm();break;
    case 'delform':
      if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Tap again to delete';break}
      delDoc(F.id);closeSheet();render();toast('Deleted');break;
    case 'addmember':{const v=$('#newMember').value.trim();if(!v)break;cfg.members.push({id:uid(),name:v});saveCfg();openSettings();render();break}
    case 'rmmember':
      if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Tap again';break}
      {const first=cfg.members.find(m=>m.id!==id).id;for(const d of docs.filter(x=>x.member===id)){d.member=first;await putDoc(d)}
      cfg.members=cfg.members.filter(m=>m.id!==id);if(S.member===id)S.member='all';saveCfg();openSettings();render()}break;
    case 'savesettings':
      document.querySelectorAll('.mname').forEach(i=>{const m=cfg.members.find(x=>x.id===i.dataset.id);if(m&&i.value.trim())m.name=i.value.trim()});
      cfg.warn=+$('#s_warn').value;cfg.theme=$('#s_theme').value;saveCfg();closeSheet();render();toast('Saved');break;
    case 'setpin':openPin('set');break;
    case 'chpin':openPin('change');break;
    case 'rmpin':openPin('remove');break;
    case 'savepin':{
      const mode=b.dataset.mode,er=$('#pinErr');
      if(!db){er.textContent='Storage is not available in this browser, so encryption cannot be used.';break}
      if(S.kdf&&!(await checkPass($('#pinCur').value))){er.textContent='The current passcode is wrong.';break}
      if(mode==='remove'){
        b.disabled=true;er.textContent='Working...';
        try{await disableEnc();closeSheet();render();toast('Encryption turned off')}catch(err){er.textContent='Could not turn it off. Nothing was changed.';b.disabled=false}
        break;
      }
      const p1=$('#pin1').value,p2v=$('#pin2').value;
      if(p1.length<6){er.textContent='Use at least 6 characters.';break}
      if(p1!==p2v){er.textContent='The two passcodes do not match.';break}
      b.disabled=true;er.textContent='Encrypting. This can take a moment...';
      try{await enableEnc(p1);closeSheet();render();toast('Your files are now encrypted')}
      catch(err){er.textContent='Could not encrypt. Nothing was changed.';b.disabled=false}
      break}
    case 'restoreenc':{
      const j=pendingRestore,er=$('#pinErr'),pw=($('#bkPass')||{}).value||'';
      if(!j)break;
      er.textContent='Unlocking backup...';
      try{
        const key=await deriveKey(pw,b64u8(j.kdf.salt),j.kdf.iter);await verify(key,j.kdf);
        for(const m of (j.members||[]))if(m&&m.id&&!cfg.members.some(x=>x.id===m.id))cfg.members.push(m);
        let n=0;
        for(const r of j.docs){
          if(docs.some(x=>x.id===r.id))continue;
          const rec={id:r.id,iv:b64u8(r.iv),meta:b64u8(r.meta),files:r.files.map(f=>({iv:b64u8(f.iv),ct:b64u8(f.ct)}))};
          await putDoc(await unsealRec(rec,key));n++;
        }
        pendingRestore=null;saveCfg();closeSheet();render();toast('Restored '+n+' documents');
      }catch(err){er.textContent='Wrong passcode for this backup, or the file is damaged.'}
      break}
    case 'backup':backup();break;
    case 'rmsample':for(const d of docs.filter(x=>x.sample))delDoc(d.id);closeSheet();render();break;
    case 'wipe':
      if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Tap again to delete everything';break}
      await wipeAll();break;
  }
});
async function wipeAll(){
  if(db)await new Promise(res=>{try{const tx=db.transaction(['docs','meta'],'readwrite');tx.objectStore('docs').clear();tx.objectStore('meta').clear();tx.oncomplete=tx.onerror=tx.onabort=()=>res()}catch(e){res()}});
  docs=[];KEY=null;S.kdf=null;revokeUrls();
  cfg.members=[{id:'m1',name:'Me'}];cfg.pin='';cfg.salt='';cfg.seeded=true;saveCfg();
  S.locked=false;S.member='all';closeSheet();closeViewer();render();toast('Everything deleted');
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f_files'){F.files.push(...[...t.files].map(f=>({name:f.name,type:f.type,blob:f})));t.value='';fileList()}
  else if(t.id==='restoreIn'){const f=t.files[0];t.value='';if(f)restore(f)}
  else if(t.id==='f_type'&&$('#f_name')&&!$('#f_name').value.trim())$('#f_name').value=t.value;
});

/* ---------- start ---------- */
(async()=>{
  loadCfg();
  db=await openDB();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  S.kdf=db?await getMeta():null;
  docs=S.kdf?[]:await dbAll();
  if(!docs.length&&!cfg.seeded&&!S.kdf){
    cfg.members=[{id:'m1',name:'Me'},{id:'m2',name:'Mom'}];
    const base={files:[],sample:true,notes:'',issued:''};
    for(const d of [
      {type:'Passport',name:'Passport',member:'m1',number:'K1234567',expiry:addDays(today(),45)},
      {type:'Insurance policy',name:'Car insurance',member:'m1',number:'POL/2024/889211',expiry:addDays(today(),-12)},
      {type:'PAN card',name:'PAN card',member:'m1',number:'ABCDE1234F',expiry:''},
      {type:'Driving licence',name:'Driving licence',member:'m2',number:'KA0120190012345',expiry:addDays(today(),430)}
    ])await putDoc(Object.assign({id:uid()},base,d));
    cfg.seeded=true;saveCfg();
  }
  if(hasLock())S.locked=true;
  render();
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
})();
</script>
</body></html>
